# Latido del worker en Vercel · post-Sprint 7
#
# El plan gratuito de Vercel solo permite cron jobs una vez al día, y el
# sistema necesita POST /api/jobs/tick cada minuto para expirar apartados,
# encolar recordatorios y generar las variantes de las fotos — ver
# docs/decisiones/0005-vercel-y-blob.md.
#
# GitHub Actions no garantiza el minuto exacto (puede atrasarse en horas de
# carga alta), así que se pide cada 5 minutos: no es "cada minuto" literal,
# pero es lo más frecuente que GitHub soporta de forma confiable, y muy por
# encima del "una vez al día" del cron nativo. /api/health sigue siendo la
# alarma real si algún día deja de correr.

name: Latido del worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    name: POST /api/jobs/tick
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al latido
        run: |
          status=$(curl -s -o /tmp/tick.json -w "%{http_code}" -X POST \
            "${SITE_URL}/api/jobs/tick" \
            -H "x-job-secret: ${JOBS_SECRET}")
          cat /tmp/tick.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "El latido respondió $status" >&2
            exit 1
          fi
        env:
          SITE_URL: https://adrimarket.vercel.app
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
