# Desplegar producción · automatización del 2026-09-07
#
# Cierra el ciclo que hasta hoy terminaba a mano: commit → PR → CI → merge →
# **migrar** → **desplegar** → **comprobar que lo desplegado sirve**.
#
# ---------------------------------------------------------------------------
# Por qué no se despliega desde la laptop
# ---------------------------------------------------------------------------
#
# El 2026-09-07 un `vercel --prod` desde la máquina de desarrollo subió el
# `.env` local pese a estar en `.gitignore`. El log lo dijo con todas sus
# letras —`- Environments: .env`— y Next lo cargó en el build de producción.
# Las variables que Vercel define ganaron, pero **las que no, se llenaron con
# el valor local**: `PAYMENT_SIMULATOR=si` viajó de la laptop a producción y
# dejó vivo el botón que confirma reservas sin cobrar. El despliegue que iba a
# cerrar ese hueco lo mantuvo abierto por otra puerta.
#
# Existe `.vercelignore` para que no vuelva a pasar, pero la defensa de verdad
# es esta: **el runner no tiene `.env`**, porque git nunca lo tuvo. Desplegar
# desde CI hace que ese error sea imposible en lugar de improbable.
#
# ---------------------------------------------------------------------------
# Por qué `workflow_run` y no `push`
# ---------------------------------------------------------------------------
#
# Se despliega **después** de que la CI termine en verde sobre la rama que
# despliega, no en paralelo. Con `push` las dos arrancarían a la vez y
# producción podría estrenar un commit cuyas pruebas todavía no han terminado
# —o que van a fallar—. Aquí, si la CI no pasó, esto ni siquiera corre.
#
# ---------------------------------------------------------------------------
# El orden migrar → desplegar no es negociable
# ---------------------------------------------------------------------------
#
# El código nuevo lee columnas que la migración crea. Al revés, entre el
# despliegue y la migración hay una ventana en la que producción sirve código
# que consulta algo que no existe. Por eso van en el mismo job y en este orden:
# si la migración falla, no hay despliegue.
#
# Las migraciones son aditivas por convención (nunca se edita una aplicada), así
# que migrar antes es seguro para el código viejo que todavía está arriba
# durante esos segundos.

name: Desplegar producción

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - 'claude/**'
  # Escotilla manual para volver a desplegar sin tocar código.
  workflow_dispatch:

concurrency:
  # Dos despliegues a la vez sobre la misma base y el mismo proyecto no tienen
  # sentido, y el segundo podría adelantar al primero.
  group: desplegar-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Migrar y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Sin esto, un PR que no pasó la CI llegaría hasta aquí. `workflow_dispatch`
    # no trae `workflow_run`, así que se acepta explícitamente.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ── Compuerta 0: ¿están las llaves? ──
      # Falla aquí, en el primer paso y con un mensaje que dice qué hacer, en
      # vez de a mitad del despliegue con un error de la API de Vercel.
      - name: Comprobar credenciales
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          falta=0
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN. Se genera en"\
                 "vercel.com/account/tokens (alcance: el equipo del proyecto) y se"\
                 "carga con: gh secret set VERCEL_TOKEN"
            falta=1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (la cadena directa de Neon)."
            falta=1
          fi
          [ "$falta" -eq 0 ] || exit 1

      - uses: actions/checkout@v4
        with:
          # `workflow_run` apunta al commit que disparó la CI, no a la punta de
          # la rama. Sin esto se desplegaría lo que hubiera en HEAD, que puede
          # ser otra cosa.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Paso 1: migrar, antes de desplegar ──
      - name: Migraciones pendientes en producción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # DB_CONFIRM porque el destino ya viene del secreto, no de un teclado.
          # DB_BOOTSTRAP **no** se pasa: estrenar el esquema en una base remota
          # sigue exigiendo una decisión humana, y una base de producción vacía
          # siempre es un destino equivocado.
          DB_CONFIRM=si ./scripts/db.sh migrate

      # ── Paso 2: desplegar ──
      #
      # `shell: bash` y no el de por omisión. GitHub corre los `run:` con
      # `bash -e`, **sin `pipefail`**, y en una tubería el código de salida es
      # el del último comando. La primera versión de este paso hacía
      # `vercel deploy … | tee`, así que cuando el despliegue falló con
      # "Error: User not found" el paso se reportó **verde**: el que devolvía
      # cero era `tee`. `shell: bash` añade `-o pipefail` y el fallo se ve.
      - name: Desplegar a Vercel
        id: desplegar
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Sin esto el CLI no sabe a qué proyecto desplegar y muere con
          # "User not found", que suena a un problema del token y no lo es:
          # `.vercel/` está en `.gitignore`, así que el runner nunca tiene el
          # enlace que sí existe en la máquina de quien desarrolla.
          #
          # Son identificadores, no credenciales: van como variables del
          # repositorio y sin el token no sirven para nada.
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltan las variables VERCEL_ORG_ID / VERCEL_PROJECT_ID."\
                 "Salen de .vercel/project.json y se cargan con: gh variable set VERCEL_ORG_ID"
            exit 1
          fi

          # Versión FIJA, no `@latest`. El 2026-10-08 `@latest` pasó de 59 a 63 y
          # el CLI empezó a imprimir también el alias de producción
          # (`adrimarket.vercel.app`) después de la URL del despliegue: la
          # compuerta de abajo pescó el alias, lo comparó contra el despliegue
          # real y marcó en rojo un despliegue que sí ocurrió. Una dependencia
          # que nadie fija cambia sola; se sube a mano y con la barra en verde.
          npm i -g vercel@63.1.0
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee /tmp/despliegue.log

          # Se pesca la URL DEL DESPLIEGUE —la de forma `proyecto-hash-ámbito`—
          # y nunca el alias de producción, que el CLI también imprime desde la
          # versión 63. Con `tail -1` a secas se tomaba lo último que saliera,
          # y "lo último" cambió de versión a versión.
          url="$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/despliegue.log \
                 | grep -v '^https://adrimarket\.vercel\.app$' | tail -1)"

          # Y si no hay URL, no hubo despliegue. Esta guarda es la que habría
          # atrapado el fallo silencioso aunque `pipefail` no estuviera.
          if [ -z "$url" ]; then
            echo "::error::El CLI no devolvió ninguna URL: no hubo despliegue."
            exit 1
          fi

          echo "desplegado en: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # ── Paso 3: comprobar lo desplegado ──
      #
      # No se marca la casilla por confianza. Estas tres comprobaciones son las
      # que habrían atrapado el incidente del 2026-09-07 en el minuto uno en
      # lugar de dejarlo vivo en el sitio público.
      # Antes que nada: que producción sirva **este** despliegue y no otro.
      #
      # La primera versión de este workflow se saltó esta comprobación, y por
      # eso reportó un despliegue exitoso que nunca ocurrió: el `vercel deploy`
      # falló, el paso se puso verde por culpa de la tubería, y las
      # comprobaciones de abajo pasaron **sobre el despliegue anterior**, que
      # casualmente estaba bien. Comprobar que el sitio responde no dice nada
      # si nadie comprueba que el sitio es el que se acaba de subir.
      #
      # Se pregunta por la **API**, no por el CLI. La segunda versión usaba
      # `vercel ls --prod` y murió con "Could not retrieve Project Settings":
      # el CLI quiere un directorio enlazado y el runner no lo tiene. Tampoco
      # sirve comparar por HTTP — la URL del despliegue está detrás del SSO de
      # Vercel y responde 302, y `x-vercel-id` identifica la petición, no la
      # compilación.
      - name: El alias de producción apunta a este despliegue
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          ESPERADA: ${{ steps.desplegar.outputs.url }}
        run: |
          curl -sS --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1" \
            -o /tmp/deployments.json

          python3 - <<'PY'
          import json, os, sys

          esperada = os.environ["ESPERADA"].removeprefix("https://")
          try:
              datos = json.load(open("/tmp/deployments.json"))
              ultima = datos["deployments"][0]
          except Exception as e:
              # Si la respuesta no tiene la forma esperada se falla **y se
              # enseña**, en vez de dar por bueno lo que no se pudo leer.
              print(f"::error::No se pudo leer la respuesta de la API de Vercel: {e}")
              print(open("/tmp/deployments.json").read()[:600])
              sys.exit(1)

          print(f"  desplegada ahora: {esperada}")
          print(f"  la más reciente:  {ultima.get('url')}  ({ultima.get('state')})")

          if ultima.get("url") != esperada:
              print("::error::El despliegue de producción más reciente no es el que acaba"
                    " de crearse. Producción podría estar sirviendo código viejo.")
              sys.exit(1)
          if ultima.get("state") != "READY":
              print(f"::error::El despliegue quedó en estado {ultima.get('state')}, no READY.")
              sys.exit(1)

          print("✔ producción sirve el despliegue de esta corrida")
          PY

      - name: Comprobar que lo desplegado sirve
        shell: bash
        env:
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          sitio="https://adrimarket.vercel.app"

          # El despliegue tarda unos segundos en tomar el alias de producción.
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "$sitio/es" && break
            sleep 2
          done

          # Se provoca un latido ANTES de preguntar por la salud, igual que hace
          # smoke.sh. El latido vive en un job de Actions que corre ~6 horas y
          # se reinicia por schedule: entre que uno termina y el siguiente
          # arranca hay un hueco de minutos en el que `/api/health` dice
          # `worker: último latido hace N min` y pasa a `degraded`. Un
          # despliegue que cae en ese hueco se marcaba en rojo sin que nada
          # estuviera mal (2026-10-08, 23 minutos sin latido). Un tick aquí
          # vuelve a dejar la salud limpia si lo único que faltaba era eso; si
          # falta algo más, sigue en rojo y se ve.
          codigo=$(curl -s -o /tmp/tick.json -w "%{http_code}" -X POST \
            "$sitio/api/jobs/tick" -H "x-job-secret: ${JOBS_SECRET}")
          echo "latido provocado → $codigo $(cat /tmp/tick.json)"

          curl -s --max-time 30 "$sitio/api/health" -o /tmp/salud.json
          python3 -m json.tool /tmp/salud.json

          python3 <<'PY'
          import json, sys
          salud = json.load(open("/tmp/salud.json"))
          checks = salud["checks"]
          fallos = []

          # 1. La portada responde y la salud es legible: ya se comprobó arriba.

          # 2. **El simulador no puede estar vivo en producción.** Es el
          #    incidente del 2026-09-07 convertido en compuerta: si
          #    PAYMENT_SIMULATOR vuelve a colarse —por un .env en el paquete,
          #    por alguien que lo cargue en Vercel— el despliegue falla aquí y
          #    se ve, en vez de quedarse regalando inventario en silencio.
          detalle = checks.get("payments", {}).get("detail", "(ausente)")
          if "fingir un pago" in detalle:
              fallos.append(f"el simulador de pagos está ACTIVO en producción: {detalle}")
          print(f"pasarela: {detalle}")

          # 3. Ningún chequeo de salud en rojo.
          rojos = [k for k, v in checks.items() if not v["ok"]]
          if rojos:
              fallos.append(f"chequeos de salud en rojo: {', '.join(rojos)}")

          if fallos:
              for f in fallos:
                  print(f"::error::{f}")
              sys.exit(1)
          print("✔ producción responde, la salud está limpia y nadie puede fingir un pago")
          PY

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue a producción"
            echo
            echo "- commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- despliegue: ${{ steps.desplegar.outputs.url }}"
            echo "- sitio: https://adrimarket.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
